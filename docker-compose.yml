# CompShopper on a Linux server.
#
#   cp .env.example .env        # then edit .env (API keys, proxy, store id, ...)
#   docker compose up -d --build
#
# The app is then available on http://<server-ip>:3001
# Change the host port by setting COMPSHOPPER_PORT in .env (default 3001).

services:
  compshopper:
    image: compshopper:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: compshopper
    restart: unless-stopped
    ports:
      - "${COMPSHOPPER_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      # Always listen on 3001 inside the container; the host port is mapped above.
      PORT: "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
